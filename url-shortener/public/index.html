<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #6366f1;
      --accent-hover: #4f52d6;
      --success: #22c55e;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header h1 span { color: var(--accent); }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .container { max-width: 860px; margin: 0 auto; }

    /* ---- Card ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* ---- Shorten form ---- */
    .form-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .form-row input {
      flex: 1 1 200px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.65rem 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-row input::placeholder { color: var(--muted); }
    .form-row input:focus { border-color: var(--accent); }

    .form-row button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem 1.4rem;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .form-row button:hover { background: var(--accent-hover); }
    .form-row button:active { transform: scale(0.97); }

    /* ---- Result box ---- */
    #result-box {
      display: none;
      margin-top: 1.2rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.2rem;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    #result-box .label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
    }

    #result-link {
      color: var(--accent);
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      word-break: break-all;
    }

    #result-link:hover { text-decoration: underline; }

    .copy-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 0.35rem 0.8rem;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .copy-btn.copied { background: var(--success); border-color: var(--success); color: #fff; }

    /* ---- Error ---- */
    #error-msg {
      display: none;
      margin-top: 0.8rem;
      color: var(--danger);
      font-size: 0.88rem;
    }

    /* ---- Stats cards ---- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      text-align: center;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-card .stat-label {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ---- Table ---- */
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    thead th {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 0.65rem 1rem;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    tbody td {
      padding: 0.75rem 1rem;
      vertical-align: middle;
      color: var(--text);
    }

    .orig-url {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .short-link { color: var(--accent); text-decoration: none; font-weight: 600; }
    .short-link:hover { text-decoration: underline; }

    .badge-clicks {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      min-width: 2rem;
      padding: 0.2rem 0.6rem;
      text-align: center;
    }

    .del-btn {
      background: transparent;
      border: 1px solid var(--danger);
      border-radius: 6px;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.7rem;
      transition: background 0.15s, color 0.15s;
    }

    .del-btn:hover { background: var(--danger); color: #fff; }

    .empty-row td {
      color: var(--muted);
      font-size: 0.88rem;
      padding: 2rem;
      text-align: center;
    }

    /* ---- Responsive ---- */
    @media (max-width: 520px) {
      header h1 { font-size: 1.5rem; }
      .form-row { flex-direction: column; }
      .form-row button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 URL <span>Shortener</span></h1>
      <p>Shorten, track, and manage your links</p>
    </header>

    <!-- Shorten form -->
    <div class="card">
      <div class="form-row">
        <input id="url-input" type="url" placeholder="https://example.com/very/long/url" />
        <input id="alias-input" type="text" placeholder="Custom alias (optional)" style="flex: 0 1 190px;" />
        <button id="shorten-btn">Shorten</button>
      </div>
      <div id="error-msg"></div>
      <div id="result-box">
        <div style="flex:1; min-width:0;">
          <div class="label">Your short URL</div>
          <a id="result-link" href="#" target="_blank" rel="noopener"></a>
        </div>
        <button class="copy-btn" id="copy-btn">Copy</button>
      </div>
    </div>

    <!-- Stats summary -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="value" id="stat-total-links">0</div>
        <div class="stat-label">Total Links</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-total-clicks">0</div>
        <div class="stat-label">Total Clicks</div>
      </div>
    </div>

    <!-- Links table -->
    <div class="card">
      <div class="section-title">All Links</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Original URL</th>
              <th>Short URL</th>
              <th>Clicks</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="links-tbody">
            <tr class="empty-row"><td colspan="5">No links yet — create one above!</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const BASE = window.location.origin;

    const urlInput    = document.getElementById('url-input');
    const aliasInput  = document.getElementById('alias-input');
    const shortenBtn  = document.getElementById('shorten-btn');
    const errorMsg    = document.getElementById('error-msg');
    const resultBox   = document.getElementById('result-box');
    const resultLink  = document.getElementById('result-link');
    const copyBtn     = document.getElementById('copy-btn');
    const tbody       = document.getElementById('links-tbody');
    const statLinks   = document.getElementById('stat-total-links');
    const statClicks  = document.getElementById('stat-total-clicks');

    // ---- Shorten ----
    shortenBtn.addEventListener('click', shorten);
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') shorten(); });

    async function shorten() {
      hideError();
      resultBox.style.display = 'none';

      const url         = urlInput.value.trim();
      const customAlias = aliasInput.value.trim();

      if (!url) { showError('Please enter a URL.'); return; }

      shortenBtn.disabled = true;
      shortenBtn.textContent = 'Shortening…';

      try {
        const body = { url };
        if (customAlias) body.customAlias = customAlias;

        const res  = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) { showError(data.error || 'Something went wrong.'); return; }

        const shortUrl = `${BASE}/${data.shortCode}`;
        resultLink.href        = shortUrl;
        resultLink.textContent = shortUrl;
        resultBox.style.display = 'flex';

        urlInput.value   = '';
        aliasInput.value = '';

        await loadLinks();
      } catch {
        showError('Network error. Please try again.');
      } finally {
        shortenBtn.disabled    = false;
        shortenBtn.textContent = 'Shorten';
      }
    }

    // ---- Copy ----
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultLink.href).then(() => {
        copyBtn.textContent = '✓ Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });

    // ---- Load links ----
    async function loadLinks() {
      try {
        const res   = await fetch('/api/links');
        const links = await res.json();

        statLinks.textContent  = links.length;
        statClicks.textContent = links.reduce((s, l) => s + l.clickCount, 0);

        if (links.length === 0) {
          tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No links yet — create one above!</td></tr>';
          return;
        }

        tbody.innerHTML = links.map(link => {
          const shortUrl = `${BASE}/${link.shortCode}`;
          const date     = new Date(link.createdAt).toLocaleDateString(undefined, {
            month: 'short', day: 'numeric', year: 'numeric'
          });
          return `
            <tr>
              <td><div class="orig-url" title="${escHtml(link.originalUrl)}">${escHtml(link.originalUrl)}</div></td>
              <td><a class="short-link" href="${shortUrl}" target="_blank" rel="noopener">${escHtml(link.shortCode)}</a></td>
              <td><span class="badge-clicks">${link.clickCount}</span></td>
              <td style="white-space:nowrap; color: var(--muted);">${date}</td>
              <td><button class="del-btn" data-code="${escHtml(link.shortCode)}">Delete</button></td>
            </tr>`;
        }).join('');

        tbody.querySelectorAll('.del-btn').forEach(btn => {
          btn.addEventListener('click', () => deleteLink(btn.dataset.code));
        });
      } catch {
        /* silent — table stays as-is */
      }
    }

    // ---- Delete ----
    async function deleteLink(shortCode) {
      if (!confirm(`Delete /${shortCode}?`)) return;
      try {
        await fetch(`/api/links/${encodeURIComponent(shortCode)}`, { method: 'DELETE' });
        await loadLinks();
      } catch {
        alert('Failed to delete. Please try again.');
      }
    }

    // ---- Helpers ----
    function showError(msg) {
      errorMsg.textContent    = msg;
      errorMsg.style.display  = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // Initial load
    loadLinks();
  </script>
</body>
</html>
