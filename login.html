<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .card h1 {
      text-align: center;
      font-size: 1.75rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .card p.subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #111827;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    input.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .field-error {
      color: #ef4444;
      font-size: 0.78rem;
      margin-top: 4px;
      display: none;
    }

    .field-error.visible {
      display: block;
    }

    .forgot {
      display: block;
      text-align: right;
      font-size: 0.8rem;
      color: #667eea;
      text-decoration: none;
      margin-top: -12px;
      margin-bottom: 20px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover {
      opacity: 0.92;
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .alert.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .alert.failure {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .divider {
      text-align: center;
      color: #9ca3af;
      font-size: 0.85rem;
      margin: 24px 0 18px;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: #e5e7eb;
    }

    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .signup-text {
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .signup-text a {
      color: #667eea;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>

    <div class="alert" id="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        <span class="field-error" id="emailError">Please enter a valid email address.</span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <span class="field-error" id="passwordError">Password must be at least 6 characters.</span>
      </div>

      <a href="#" class="forgot">Forgot password?</a>

      <button type="submit" id="submitBtn">Sign in</button>
    </form>

    <div class="divider">or</div>

    <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <script>
    // Demo credentials
    const DEMO_EMAIL = 'user@example.com';
    const DEMO_PASSWORD = 'password123';

    const form       = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passInput  = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passError  = document.getElementById('passwordError');
    const alert      = document.getElementById('alert');
    const submitBtn  = document.getElementById('submitBtn');

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function setFieldError(input, errorEl, show) {
      if (show) {
        input.classList.add('error');
        errorEl.classList.add('visible');
      } else {
        input.classList.remove('error');
        errorEl.classList.remove('visible');
      }
    }

    function showAlert(message, type) {
      alert.textContent = message;
      alert.className   = `alert ${type}`;
      alert.style.display = 'block';
    }

    function hideAlert() {
      alert.style.display = 'none';
    }

    emailInput.addEventListener('input', () => {
      if (emailInput.value) setFieldError(emailInput, emailError, !isValidEmail(emailInput.value));
    });

    passInput.addEventListener('input', () => {
      if (passInput.value) setFieldError(passInput, passError, passInput.value.length < 6);
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      hideAlert();

      const email    = emailInput.value.trim();
      const password = passInput.value;

      let valid = true;

      if (!email || !isValidEmail(email)) {
        setFieldError(emailInput, emailError, true);
        valid = false;
      } else {
        setFieldError(emailInput, emailError, false);
      }

      if (!password || password.length < 6) {
        setFieldError(passInput, passError, true);
        valid = false;
      } else {
        setFieldError(passInput, passError, false);
      }

      if (!valid) return;

      // Simulate async login
      submitBtn.disabled    = true;
      submitBtn.textContent = 'Signing in…';

      setTimeout(() => {
        if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
          showAlert('✓ Login successful! Redirecting…', 'success');
          form.reset();
        } else {
          showAlert('Invalid email or password. Try user@example.com / password123', 'failure');
        }
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Sign in';
      }, 1000);
    });
  </script>
</body>
</html>
