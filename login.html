<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    /* ── Reset & Base ────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e0e0;
    }

    /* ── Card ────────────────────────────────────────── */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }

    /* ── Logo / Heading ──────────────────────────────── */
    .card-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #e94560, #0f3460);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    .card-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .card-header p {
      margin-top: 6px;
      font-size: 0.875rem;
      color: #9ca3af;
    }

    /* ── Form ────────────────────────────────────────── */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #d1d5db;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #6b7280;
      pointer-events: none;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 42px 12px 42px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 0.95rem;
      color: #f3f4f6;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input::placeholder {
      color: #6b7280;
    }

    input:focus {
      border-color: #e94560;
      background: rgba(233, 69, 96, 0.06);
      box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.18);
    }

    input.invalid {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7280;
      padding: 0;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .toggle-password:hover { color: #e94560; }
    .toggle-password svg { width: 18px; height: 18px; }

    .field-error {
      display: none;
      margin-top: 5px;
      font-size: 0.78rem;
      color: #ef4444;
    }

    .field-error.visible { display: block; }

    /* ── Remember / Forgot ───────────────────────────── */
    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #9ca3af;
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] {
      width: 16px;
      height: 16px;
      padding: 0;
      accent-color: #e94560;
      cursor: pointer;
    }

    .forgot-link {
      font-size: 0.85rem;
      color: #e94560;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover { color: #f87171; text-decoration: underline; }

    /* ── Submit Button ───────────────────────────────── */
    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #e94560, #c0392b);
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(233, 69, 96, 0.35);
    }

    .btn-login:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(233, 69, 96, 0.45);
    }

    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Divider ─────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: #4b5563;
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* ── Social Buttons ──────────────────────────────── */
    .social-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn-social {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #d1d5db;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-social:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-social svg { width: 18px; height: 18px; }

    /* ── Sign-up Link ────────────────────────────────── */
    .signup-prompt {
      text-align: center;
      font-size: 0.875rem;
      color: #9ca3af;
    }

    .signup-prompt a {
      color: #e94560;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-prompt a:hover { text-decoration: underline; }

    /* ── Toast ───────────────────────────────────────── */
    #toast {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: slideUp 0.3s ease;
    }

    #toast.success { background: #16a34a; color: #fff; }
    #toast.error   { background: #dc2626; color: #fff; }

    @keyframes slideUp {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 480px) {
      .card { padding: 36px 24px; margin: 16px; }
      .social-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="card" role="main">

    <!-- Header -->
    <div class="card-header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
        </svg>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to continue to your account</p>
    </div>

    <!-- Social Login -->
    <div class="social-buttons">
      <button class="btn-social" type="button" aria-label="Continue with Google">
        <!-- Google icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115z"/>
          <path fill="#34A853" d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.077 7.077 0 0 1-6.723-4.823l-4.04 3.067A11.965 11.965 0 0 0 12 24c2.933 0 5.735-1.043 7.834-3l-3.793-2.987z"/>
          <path fill="#4A90D9" d="M19.834 21c2.195-2.048 3.62-5.096 3.62-9 0-.71-.109-1.473-.272-2.182H12v4.637h6.436c-.317 1.559-1.17 2.766-2.395 3.558L19.834 21z"/>
          <path fill="#FBBC05" d="M5.277 14.268A7.12 7.12 0 0 1 4.909 12c0-.782.125-1.533.357-2.235L1.24 6.65A11.934 11.934 0 0 0 0 12c0 1.92.445 3.73 1.237 5.335l4.04-3.067z"/>
        </svg>
        Google
      </button>
      <button class="btn-social" type="button" aria-label="Continue with GitHub">
        <!-- GitHub icon -->
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
        </svg>
        GitHub
      </button>
    </div>

    <div class="divider">or sign in with email</div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            aria-describedby="email-error"
            required
          />
        </div>
        <span class="field-error" id="email-error" role="alert"></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            aria-describedby="password-error"
            required
          />
          <button class="toggle-password" type="button" aria-label="Toggle password visibility" data-target="password">
            <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eye-closed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-error" id="password-error" role="alert"></span>
      </div>

      <!-- Remember / Forgot -->
      <div class="form-footer">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember" />
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button class="btn-login" type="submit" id="submitBtn">Sign In</button>

    </form>

    <div class="divider" style="margin-top:28px;margin-bottom:20px;"></div>

    <!-- Sign-up -->
    <p class="signup-prompt">
      Don't have an account? <a href="#">Create one free</a>
    </p>

  </div>

  <!-- Toast notification -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    /* ── Helpers ────────────────────────────────────── */
    const $ = id => document.getElementById(id);

    function showError(inputEl, errorEl, msg) {
      inputEl.classList.add('invalid');
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    function clearError(inputEl, errorEl) {
      inputEl.classList.remove('invalid');
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
    }

    function showToast(msg, type = 'success', duration = 3500) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.className = type;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, duration);
    }

    /* ── Toggle password visibility ─────────────────── */
    document.querySelector('.toggle-password').addEventListener('click', function () {
      const input = $('password');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      $('eye-open').style.display  = isHidden ? 'none'  : 'block';
      $('eye-closed').style.display = isHidden ? 'block' : 'none';
      this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });

    /* ── Real-time validation ───────────────────────── */
    const emailInput    = $('email');
    const passwordInput = $('password');
    const emailError    = $('email-error');
    const passwordError = $('password-error');

    emailInput.addEventListener('blur', () => {
      if (!emailInput.value.trim()) {
        showError(emailInput, emailError, 'Email address is required.');
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())) {
        showError(emailInput, emailError, 'Please enter a valid email address.');
      } else {
        clearError(emailInput, emailError);
      }
    });

    emailInput.addEventListener('input', () => clearError(emailInput, emailError));

    passwordInput.addEventListener('blur', () => {
      if (!passwordInput.value) {
        showError(passwordInput, passwordError, 'Password is required.');
      } else if (passwordInput.value.length < 6) {
        showError(passwordInput, passwordError, 'Password must be at least 6 characters.');
      } else {
        clearError(passwordInput, passwordError);
      }
    });

    passwordInput.addEventListener('input', () => clearError(passwordInput, passwordError));

    /* ── Form submit ────────────────────────────────── */
    $('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      let valid = true;

      const emailVal = emailInput.value.trim();
      if (!emailVal) {
        showError(emailInput, emailError, 'Email address is required.');
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
        showError(emailInput, emailError, 'Please enter a valid email address.');
        valid = false;
      } else {
        clearError(emailInput, emailError);
      }

      const passVal = passwordInput.value;
      if (!passVal) {
        showError(passwordInput, passwordError, 'Password is required.');
        valid = false;
      } else if (passVal.length < 6) {
        showError(passwordInput, passwordError, 'Password must be at least 6 characters.');
        valid = false;
      } else {
        clearError(passwordInput, passwordError);
      }

      if (!valid) return;

      /* Simulate async login */
      const btn = $('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Sign In';
        // Demo: always succeeds — replace with real API call
        showToast('✓ Signed in successfully!', 'success');
      }, 1500);
    });
  </script>

</body>
</html>
